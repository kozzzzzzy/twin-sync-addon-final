{% extends "base.html" %}

{% block title %}Spot Details - TwinSync Spot{% endblock %}

{% block content %}
<div id="spot-detail" class="spot-detail">
    <div class="loading">Loading spot...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
const INGRESS_PATH = "{{ ingress_path }}";
const SPOT_ID = {{ spot_id }};

async function loadSpot() {
    const container = document.getElementById('spot-detail');
    
    try {
        const data = await api(`/api/spots/${SPOT_ID}`);
        const spot = data.spot;
        const memory = data.memory;
        const checks = data.recent_checks || [];
        
        const statusClass = spot.status === 'sorted' ? 'status-sorted' : 
                            spot.status === 'needs_attention' ? 'status-needs-attention' :
                            spot.status === 'snoozed' ? 'status-snoozed' : 'status-unknown';
        
        const statusEmoji = spot.status === 'sorted' ? '✅' :
                            spot.status === 'needs_attention' ? '⚠️' :
                            spot.status === 'snoozed' ? '😴' : '❓';
        
        const statusText = spot.status === 'sorted' ? 'Looking Good' :
                           spot.status === 'needs_attention' ? 'Needs Attention' :
                           spot.status === 'snoozed' ? 'Snoozed' : 'Not Checked';
        
        const latestCheck = checks[0] || null;
        
        container.innerHTML = `
            <div class="spot-detail-header ${statusClass}">
                <div class="spot-detail-title">
                    <a href="${INGRESS_PATH}/" class="back-link">← Back</a>
                    <h1>${escapeHtml(spot.name)}</h1>
                    <span class="spot-status-badge">${statusEmoji} ${statusText}</span>
                </div>
                <div class="spot-detail-actions">
                    <button onclick="checkSpot(${SPOT_ID})" class="btn btn-primary">📷 Check Now</button>
                    <button onclick="resetSpot(${SPOT_ID})" class="btn btn-success">✅ I've Reset It</button>
                    ${spot.status !== 'snoozed' 
                        ? `<button onclick="snoozeSpot(${SPOT_ID})" class="btn btn-muted">😴 Later</button>`
                        : `<button onclick="unsnoozeSpot(${SPOT_ID})" class="btn btn-muted">⏰ Wake Up</button>`
                    }
                </div>
            </div>
            
            <div class="spot-detail-content">
                <div class="spot-section">
                    <h2>Definition</h2>
                    <div class="definition-box">${escapeHtml(spot.definition).replace(/\n/g, '<br>')}</div>
                </div>
                
                ${latestCheck ? `
                <div class="spot-section">
                    <h2>Latest Check</h2>
                    <div class="check-result">
                        ${latestCheck.to_sort && latestCheck.to_sort.length > 0 ? `
                            <div class="check-list to-sort-list">
                                <h3>To Sort</h3>
                                <ul>
                                    ${latestCheck.to_sort.map(item => `
                                        <li>
                                            ${typeof item === 'string' ? escapeHtml(item) : escapeHtml(item.item)}
                                            ${item.location ? `<span class="item-location">(${escapeHtml(item.location)})</span>` : ''}
                                            ${item.recurring ? `<span class="recurring-badge">🔄 ${item.recurrence_count || ''}x</span>` : ''}
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        ` : ''}
                        
                        ${latestCheck.looking_good && latestCheck.looking_good.length > 0 ? `
                            <div class="check-list looking-good-list">
                                <h3>Looking Good</h3>
                                <ul>
                                    ${latestCheck.looking_good.map(item => `
                                        <li>✓ ${typeof item === 'string' ? escapeHtml(item) : escapeHtml(item.item || item)}</li>
                                    `).join('')}
                                </ul>
                            </div>
                        ` : ''}
                        
                        ${latestCheck.notes && latestCheck.notes.main ? `
                            <div class="check-notes">
                                <p class="notes-main">${escapeHtml(latestCheck.notes.main)}</p>
                                ${latestCheck.notes.pattern ? `<p class="notes-pattern">📊 ${escapeHtml(latestCheck.notes.pattern)}</p>` : ''}
                                ${latestCheck.notes.encouragement ? `<p class="notes-encouragement">💪 ${escapeHtml(latestCheck.notes.encouragement)}</p>` : ''}
                            </div>
                        ` : ''}
                    </div>
                </div>
                ` : `
                <div class="spot-section">
                    <div class="empty-check">
                        <p>No checks yet. Click "Check Now" to analyze this spot!</p>
                    </div>
                </div>
                `}
                
                <div class="spot-section">
                    <h2>Stats & Patterns</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <span class="stat-value">🔥 ${spot.current_streak}</span>
                            <span class="stat-label">Current Streak</span>
                            ${spot.longest_streak > spot.current_streak ? `<span class="stat-best">Best: ${spot.longest_streak}</span>` : ''}
                        </div>
                        <div class="stat-card">
                            <span class="stat-value">${memory.total_checks}</span>
                            <span class="stat-label">Total Checks</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-value">${spot.total_resets}</span>
                            <span class="stat-label">Total Resets</span>
                        </div>
                    </div>
                    
                    ${Object.keys(memory.patterns.recurring_items || {}).length > 0 ? `
                        <div class="patterns-section">
                            <h3>Recurring Items</h3>
                            <ul class="recurring-items-list">
                                ${Object.entries(memory.patterns.recurring_items).map(([item, count]) => 
                                    `<li>🔄 ${escapeHtml(item)} <span class="count">(${count}x)</span></li>`
                                ).join('')}
                            </ul>
                        </div>
                    ` : ''}
                    
                    <div class="patterns-meta">
                        ${memory.patterns.worst_day ? `<p>📅 Worst day: <strong>${memory.patterns.worst_day}</strong></p>` : ''}
                        ${memory.patterns.best_day ? `<p>🌟 Best day: <strong>${memory.patterns.best_day}</strong></p>` : ''}
                        ${memory.patterns.usually_sorted_by ? `<p>⏰ Usually sorted by: <strong>${memory.patterns.usually_sorted_by}</strong></p>` : ''}
                    </div>
                </div>
                
                ${checks.length > 1 ? `
                <div class="spot-section">
                    <h2>Recent History</h2>
                    <table class="checks-table">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Items</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${checks.slice(0, 10).map(check => `
                                <tr class="${check.status === 'sorted' ? 'row-sorted' : 'row-needs-attention'}">
                                    <td>${formatTime(check.timestamp)}</td>
                                    <td>${check.status === 'sorted' ? '✅' : '⚠️'} ${check.status}</td>
                                    <td>${(check.to_sort || []).length} to sort</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                ` : ''}
                
                <div class="spot-section danger-zone">
                    <h2>Danger Zone</h2>
                    <button onclick="deleteSpot(${SPOT_ID})" class="btn btn-danger">🗑️ Delete This Spot</button>
                </div>
            </div>
        `;
        
    } catch (err) {
        container.innerHTML = `<div class="error">Failed to load spot: ${err.message}</div>`;
    }
}

function formatTime(isoString) {
    const date = new Date(isoString);
    return date.toLocaleString();
}

function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

loadSpot();
</script>
{% endblock %}
